apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-service
  namespace: {{ .Values.namespace }}
spec:
  selector: 
    app: {{ .Release.Name }}
  type: NodePort
  ports:
    - port: {{ .Values.app.exposedPorts.servicePort }}
      targetPort: {{ .Values.app.exposedPorts.servicePort }}
